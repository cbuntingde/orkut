services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: orkut
      POSTGRES_PASSWORD: orkut
      POSTGRES_DB: orkut
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orkut -d orkut"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://orkut:orkut@db:5432/orkut
    profiles: ["full"]

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    profiles: ["tools"]

volumes:
  pgdata:
